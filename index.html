<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#070913" />
  <title>ByteX Name Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #070913;
      --bg-card: rgba(17, 23, 46, 0.72);
      --bg-input: rgba(10, 14, 30, 0.85);
      --border-glass: rgba(114, 137, 255, 0.22);
      --text-main: #f4f7ff;
      --text-muted: #94a3b8;
      --neon-cyan: #00f0ff;
      --neon-purple: #8b5cf6;
      --neon-blue: #3b82f6;
      --gradient-brand: linear-gradient(135deg, #00f0ff 0%, #3b82f6 50%, #8b5cf6 100%);
      --shadow-glow: 0 12px 32px -8px rgba(0, 240, 255, 0.28);
    }

    [data-theme="light"] {
      --bg-primary: #eef2ff;
      --bg-card: rgba(255, 255, 255, 0.86);
      --bg-input: rgba(241, 245, 249, 0.95);
      --border-glass: rgba(99, 102, 241, 0.2);
      --text-main: #0f172a;
      --text-muted: #475569;
      --shadow-glow: 0 12px 28px -8px rgba(59, 130, 246, 0.22);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(75px);
      z-index: -1;
      opacity: 0.45;
      pointer-events: none;
    }
    .orb-1 { width: 260px; height: 260px; background: var(--neon-purple); top: -60px; left: -60px; }
    .orb-2 { width: 240px; height: 240px; background: var(--neon-cyan); bottom: -50px; right: -50px; }
    .orb-3 { width: 200px; height: 200px; background: var(--neon-blue); top: 40%; left: 30%; opacity: 0.25; }

    .app-shell { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 18px; }

    .app-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 44px; height: 44px; border-radius: 12px; background: var(--gradient-brand);
      display: grid; place-items: center; font-family: 'Space Grotesk', sans-serif;
      font-weight: 700; font-size: 1.15rem; color: #050814; box-shadow: var(--shadow-glow);
    }
    .brand-text h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.25rem; line-height: 1.1; }
    .brand-text h1 span { background: var(--gradient-brand); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-text p { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

    .icon-btn {
      width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--border-glass);
      background: var(--bg-card); color: var(--text-main); display: grid; place-items: center; cursor: pointer;
    }

    .glass-card {
      background: var(--bg-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass); border-radius: 20px; padding: 20px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
    }

    .workspace { display: flex; flex-direction: column; gap: 18px; }
    .section-label { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 10px; }

    .dropdown-wrapper { position: relative; margin-bottom: 16px; }
    .country-trigger {
      width: 100%; height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--border-glass);
      background: var(--bg-input); color: var(--text-main); display: flex; align-items: center; gap: 12px;
      font-size: 1rem; font-weight: 600; cursor: pointer; text-align: left;
    }
    .selected-flag { font-size: 1.4rem; }
    .selected-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .dropdown-menu {
      position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: var(--bg-primary);
      border: 1px solid var(--neon-cyan); border-radius: 16px; z-index: 50; box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55); overflow: hidden;
    }
    .search-box { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border-glass); color: var(--text-muted); }
    .search-box input { width: 100%; background: transparent; border: none; outline: none; color: var(--text-main); font-size: 0.95rem; }

    .country-list { list-style: none; max-height: 240px; overflow-y: auto; overscroll-behavior: contain; }
    .country-item {
      padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 0.95rem; border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .country-item:hover, .country-item.active { background: rgba(0, 240, 255, 0.14); }

    .gender-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .gender-btn {
      height: 48px; border-radius: 14px; border: 1px solid var(--border-glass); background: var(--bg-input);
      color: var(--text-muted); font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    }
    .gender-btn.active {
      border-color: var(--neon-cyan); color: var(--text-main); background: linear-gradient(135deg, rgba(0, 240, 255, 0.16), rgba(139, 92, 246, 0.18)); box-shadow: 0 0 20px rgba(0, 240, 255, 0.18);
    }

    .meta-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 0.8rem; }
    .badge { color: var(--neon-cyan); font-weight: 600; }
    .counter { color: var(--text-muted); font-variant-numeric: tabular-nums; }

    .name-box {
      width: 100%; min-height: 118px; padding: 20px 16px; border-radius: 16px; border: 1px dashed rgba(0, 240, 255, 0.45);
      background: var(--bg-input); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; margin-bottom: 16px;
    }
    .name-box:active { transform: scale(0.98); border-color: var(--neon-cyan); }
    .generated-name { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.45rem, 6vw, 1.95rem); font-weight: 700; color: var(--text-main); text-align: center; word-break: break-word; }
    .tap-hint { font-size: 0.75rem; color: var(--text-muted); }

    .action-row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; }
    .btn { height: 50px; border-radius: 14px; font-size: 0.95rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: none; }
    .btn:active { transform: scale(0.97); }
    .btn-secondary { background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border-glass); }
    .btn-primary { background: var(--gradient-brand); color: #050814; box-shadow: var(--shadow-glow); }

    .loader-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 220px; text-align: center; }
    .spinner { width: 38px; height: 38px; border: 3px solid rgba(0, 240, 255, 0.2); border-top-color: var(--neon-cyan); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state { padding: 24px 16px; text-align: center; color: var(--text-muted); }
    .empty-state p { font-weight: 600; color: var(--text-main); margin-bottom: 4px; }
    .empty-state span { font-size: 0.8rem; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(90px);
      background: #0f172a; color: #00f0ff; border: 1px solid #00f0ff; padding: 12px 20px; border-radius: 999px;
      font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      opacity: 0; pointer-events: none; transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease; z-index: 100;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .hidden { display: none !important; }
  </style>
</head>

              <input type="search" id="country-search" placeholder="Search 195 countries..." autocomplete="off" />
            </div>

            <div id="empty-search" class="empty-state hidden">

          </div>
        </div>

        <div class="gender-grid">

            Male

            Female
          </button>
        </div>
      </div>

      <div class="glass-card display-card">
        <div class="meta-bar">
          <span class="badge" id="active-badge">🇺🇸 United States • Male</span>
          <span class="counter" id="pool-counter">1 / 100</span>
        </div>

        <button type="button" id="name-display-btn" class="name-box" title="Tap to copy name">

    function seededShuffle(array, seedStr) {
      let hash = 2166136261;
      for (let i = 0; i < seedStr.length; i++) {
        hash ^= seedStr.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        hash = (hash * 1664525 + 1013904223) >>> 0;
        const j = hash % (i + 1);
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function isoToFlag(iso) {
      return iso.toUpperCase().replace(/./g, (char) => String.fromCodePoint(127397 + char.charCodeAt(0)));
    }

    function generateUniqueFullNames(givenList, surnameList, countryCode, targetCount = 100) {
      const combinations = new Set();
      const shuffledGiven = seededShuffle(givenList, `${countryCode}_given`);
      const shuffledSurnames = seededShuffle(surnameList, `${countryCode}_sur`);

      for (let offset = 0; offset < shuffledSurnames.length; offset++) {
        for (let i = 0; i < shuffledGiven.length; i++) {
          const first = shuffledGiven[i];
          const last = shuffledSurnames[(i + offset) % shuffledSurnames.length];
          combinations.add(`${first} ${last}`);
          if (combinations.size === targetCount) {
            return Array.from(combinations);
          }
        }
      }
      return Array.from(combinations);
    }

    class ByteXNameGenerator {
      constructor() {
        this.countries = [];
        this.selectedCountry = null;
        this.selectedGender = 'male';
        this.currentName = '';
        this.decks = new Map();
        this.toastTimer = null;

        this.cacheDOM();
        this.bindEvents();
        this.initTheme();
        this.buildDataset();
      }

      cacheDOM() {
        this.loadingState = document.getElementById('loading-state');
        this.workspace = document.getElementById('workspace');
        this.dbStats = document.getElementById('db-stats');
        this.countryCount = document.getElementById('country-count');
        this.dropdown = document.getElementById('country-dropdown');
        this.countryTrigger = document.getElementById('country-trigger');
        this.selectedFlag = document.getElementById('selected-flag');
        this.selectedName = document.getElementById('selected-name');
        this.dropdownMenu = document.getElementById('dropdown-menu');
        this.countrySearch = document.getElementById('country-search');
        this.countryList = document.getElementById('country-list');
        this.emptySearch = document.getElementById('empty-search');
        this.btnMale = document.getElementById('btn-male');
        this.btnFemale = document.getElementById('btn-female');
        this.activeBadge = document.getElementById('active-badge');
        this.poolCounter = document.getElementById('pool-counter');
        this.nameDisplayBtn = document.getElementById('name-display-btn');
        this.generatedNameEl = document.getElementById('generated-name');
        this.btnCopy = document.getElementById('btn-copy');
        this.btnNext = document.getElementById('btn-next');
        this.copyToast = document.getElementById('copy-toast');
        this.themeToggle = document.getElementById('theme-toggle');
        this.iconSun = document.getElementById('theme-icon-sun');
        this.iconMoon = document.getElementById('theme-icon-moon');
      }

      buildDataset() {
        try {
          this.countries = COUNTRIES_LIST.map(([name, iso, poolKey]) => {
            const pool = CULTURE_POOLS[poolKey] || CULTURE_POOLS['us_en'];
            const male = generateUniqueFullNames(pool.male, pool.surnames, `${iso}_M`, 100);
            const female = generateUniqueFullNames(pool.female, pool.surnames, `${iso}_F`, 100);
            return { name, iso, flag: isoToFlag(iso), male, female };
          });

          const totalNames = this.countries.reduce((sum, c) => sum + c.male.length + c.female.length, 0);
          this.dbStats.textContent = `${this.countries.length} Countries • ${totalNames.toLocaleString()} Unique Names`;
          this.countryCount.textContent = this.countries.length;

          this.renderCountryList(this.countries);
          const defaultCountry = this.countries.find((c) => c.iso === 'US') || this.countries[0];
          this.selectCountry(defaultCountry);

          this.loadingState.classList.add('hidden');
          this.workspace.classList.remove('hidden');
        } catch (err) {
          this.loadingState.innerHTML = `<p>Unable to initialize dataset.</p>`;
          console.error(err);
        }
      }

      renderCountryList(list) {
        this.countryList.innerHTML = '';
        if (list.length === 0) {
          this.emptySearch.classList.remove('hidden');
          return;
        }
        this.emptySearch.classList.add('hidden');

        const fragment = document.createDocumentFragment();
        list.forEach((country) => {
          const li = document.createElement('li');
          li.className = 'country-item';
          li.setAttribute('role', 'option');
          if (this.selectedCountry && country.iso === this.selectedCountry.iso) {
            li.classList.add('active');
          }
          li.innerHTML = `<span>${country.flag}</span><span>${country.name}</span>`;
          li.addEventListener('click', () => {
            this.selectCountry(country);
            this.closeDropdown();
          });
          fragment.appendChild(li);
        });
        this.countryList.appendChild(fragment);
      }

      selectCountry(country) {
        this.selectedCountry = country;
        this.selectedFlag.textContent = country.flag;
        this.selectedName.textContent = country.name;
        this.generateNextName();
      }

      setGender(gender) {
        if (this.selectedGender === gender) return;
        this.selectedGender = gender;
        this.btnMale.classList.toggle('active', gender === 'male');
        this.btnFemale.classList.toggle('active', gender === 'female');
        this.generateNextName();
      }

      generateNextName() {
        if (!this.selectedCountry) return;
        const key = `${this.selectedCountry.iso}_${this.selectedGender}`;
        const fullPool = this.selectedCountry[this.selectedGender];

        if (!this.decks.has(key) || this.decks.get(key).queue.length === 0) {
          const shuffled = [...fullPool];
          for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
          }
          this.decks.set(key, { queue: shuffled, total: fullPool.length });
        }

        const deck = this.decks.get(key);
        this.currentName = deck.queue.pop();
        const usedCount = deck.total - deck.queue.length;

        const genderLabel = this.selectedGender === 'male' ? 'Male' : 'Female';
        this.activeBadge.textContent = `${this.selectedCountry.flag} ${this.selectedCountry.name} • ${genderLabel}`;
        this.poolCounter.textContent = `${usedCount} / ${deck.total}`;
        this.generatedNameEl.textContent = this.currentName;
      }

      async copyCurrentName() {
        if (!this.currentName) return;
        let copied = false;
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(this.currentName);
            copied = true;
          } catch { copied = false; }
        }
        if (!copied) {
          const textArea = document.createElement('textarea');
          textArea.value = this.currentName;
          textArea.style.position = 'fixed';
          textArea.style.opacity = '0';
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          try { copied = document.execCommand('copy'); } catch { copied = false; }
          document.body.removeChild(textArea);
        }
        if (copied) this.showToast('Copied Successfully!');
      }

      showToast(message) {
        this.copyToast.querySelector('span').textContent = message;
        this.copyToast.classList.add('show');
        clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => this.copyToast.classList.remove('show'), 2000);
      }

      toggleDropdown() {
        const isHidden = this.dropdownMenu.classList.contains('hidden');
        if (isHidden) {
          this.dropdownMenu.classList.remove('hidden');
          this.countryTrigger.setAttribute('aria-expanded', 'true');
          this.countrySearch.value = '';
          this.renderCountryList(this.countries);
          this.countrySearch.focus();
        } else {
          this.closeDropdown();
        }
      }

      closeDropdown() {
        this.dropdownMenu.classList.add('hidden');
        this.countryTrigger.setAttribute('aria-expanded', 'false');
      }

      initTheme() {
        const saved = localStorage.getItem('bytex_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        this.updateThemeIcons(saved);
      }

      updateThemeIcons(theme) {
        this.iconSun.classList.toggle('hidden', theme === 'dark');
        this.iconMoon.classList.toggle('hidden', theme === 'light');
      }

      bindEvents() {
        this.countryTrigger.addEventListener('click', () => this.toggleDropdown());
        this.countrySearch.addEventListener('input', (e) => {
          const term = e.target.value.trim().toLowerCase();
          const filtered = this.countries.filter((c) => c.name.toLowerCase().includes(term));
          this.renderCountryList(filtered);
        });
        document.addEventListener('click', (e) => {
          if (!this.dropdown.contains(e.target)) this.closeDropdown();
        });
        this.btnMale.addEventListener('click', () => this.setGender('male'));
        this.btnFemale.addEventListener('click', () => this.setGender('female'));
        this.nameDisplayBtn.addEventListener('click', () => this.copyCurrentName());
        this.btnCopy.addEventListener('click', () => this.copyCurrentName());
        this.btnNext.addEventListener('click', () => this.generateNextName());
        this.themeToggle.addEventListener('click', () => {
          const current = document.documentElement.getAttribute('data-theme');
          const next = current === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('bytex_theme', next);
          this.updateThemeIcons(next);
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => new ByteXNameGenerator());
  </script>
